<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Accent Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(16,185,129,0.2)" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Modern Navigation Arrow / Pin Motif -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Navigation Arrow angled up-right -->
    <path d="M-8 -110 L92 84 L10 52 L-84 84 Z" fill="url(#arrowGrad)"/>
    <!-- Teardrop Location Hole -->
    <circle cx="0" cy="8" r="18" fill="#0f172a"/>
  </g>
</svg>
