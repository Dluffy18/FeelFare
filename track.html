<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Live Trip</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data:; img-src 'self' data: blob: https://*.tile.openstreetmap.fr; connect-src 'self' https://odhstttenhbsyyonrukn.supabase.co; object-src 'none'; base-uri 'self';">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; margin: 0; }
    #track-map { position: fixed; inset: 0; z-index: 0; }
    .track-bar {
      position: fixed; z-index: 10; left: 12px; right: 12px;
      top: calc(var(--safe-top, 0px) + 12px);
      max-width: 440px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      background: var(--paper); border: 1px solid var(--ink);
      box-shadow: var(--lift);
    }
    .track-bar img { width: 36px; height: 36px; flex: none; }
    .track-text { flex: 1; min-width: 0; }
    .track-title { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
    #track-status { margin: 2px 0 0; font-size: 16px; font-weight: 800; color: var(--ink); }
    #track-time { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .track-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--ink-3); }
    .track-dot.on { background: var(--seal-green); animation: track-pulse 1.6s ease-out infinite; }
    .track-dot.stale { background: var(--seal-gold); }
    .track-dot.off { background: var(--danger); }
    @keyframes track-pulse {
      0% { box-shadow: 0 0 0 0 rgba(22, 129, 63, .5); }
      100% { box-shadow: 0 0 0 12px rgba(22, 129, 63, 0); }
    }
    @media (prefers-reduced-motion: reduce) { .track-dot.on { animation: none; } }
  </style>
</head>

<body>
  <div id="track-map"></div>
  <div class="track-bar" role="status" aria-live="polite">
    <img src="assets/city-of-mati-logo.png" alt="" width="36" height="36">
    <div class="track-text">
      <p class="track-title">FeelFare live trip</p>
      <p id="track-status">Connecting…</p>
      <p id="track-time"></p>
    </div>
    <span id="track-dot" class="track-dot" aria-hidden="true"></span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="track.js"></script>
</body>

</html>
